repos:
  # 1. Ordenador de importaciones (isort)
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"] 

  # 2. Formateador de código (Black)
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black

  # 3. Linter súper rápido (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.0
    hooks:
      - id: ruff
        args: [ --fix ]

  # 4. Revisor de Tipado Estático (mypy)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic]