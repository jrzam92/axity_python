[tool.poetry]
name = "tools-and-envs"
version = "0.1.0"
description = "Laboratorio Python: HTTP, FastAPI, SQLAlchemy"
authors = ["JoseRaulZamora <jose.zamorav@axity.com>"]
readme = "README.md"
packages = [
    {include = "modulo_http_apis", from = "src"},
    {include = "modulo_fastapi", from = "src"},
    {include = "modulo_concurrencia", from = "src"}  # 👈 Agregar esta línea
]

[tool.poetry.dependencies]
python = "^3.12"

# FastAPI y dependencias
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-multipart = "^0.0.20"

# HTTP y MongoDB
httpx = {extras = ["http2"], version = "^0.28.0"}
requests = "^2.31.0"
aiohttp = "^3.9.0"
motor = "^3.7.0"  # Async MongoDB driver

# Utilidades
tenacity = "^8.2.3"
python-dotenv = "^1.0.0"
pyyaml = "^6.0"
bcrypt = "4.2.1"
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
aiofiles = "^25.1.0"
pandas = "^3.0.6"
numpy = "^2.5.3"
polars = "^2.0.0"
scikit-learn = "^1.9.1"
joblib = "^1.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
mypy = "^1.8.0"
pytest-cov = "^7.1.0"
hypothesis = "^6.168.5"
pytest-mock = "^3.16.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"